[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/whatsapp"
  to = "https://wa.me/918527285843?text=Hello%20NiyamDesk%2C%20I%20need%20help%20with%20business%20registration%2C%20tax%20filing%2C%20or%20compliance%20services."
  status = 302
